<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>背单词游戏 · 单词大冒险</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fff7e6;
        --surface: #ffffff;
        --text: #172554;
        --dim: #5b6b8c;
        --border: #f3d9a4;
        --accent: #2563eb;
        --display: "Baloo 2", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --body: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--body);
        font-size: 16px;
        line-height: 1.5;
        -webkit-tap-highlight-color: transparent;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; }
      button:disabled { cursor: default; }
      .display { font-family: var(--display); }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      /* ---------- layout ---------- */
      .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
      .main { padding-bottom: 7rem; }
      .topbar {
        position: sticky; top: 0; z-index: 20;
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.5rem 1rem calc(0.5rem);
        background: var(--bg);
      }
      .xp-track { margin-top: 2px; height: 10px; border-radius: 999px; background: #fde9c0; overflow: hidden; }
      .xp-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #facc15, #fb923c); transition: width .4s; }
      .pill { border-radius: 999px; padding: 0.35rem 0.75rem; font-size: 14px; font-weight: 800; font-family: var(--display); white-space: nowrap; }
      .bottomnav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        background: rgba(255,255,255,0.96); border-top: 2px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .bottomnav .grid { max-width: 42rem; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
      .navbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0.6rem 0; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--dim); }
      .navbtn .ic { font-size: 22px; line-height: 1.2; }
      .navbtn.active { color: var(--accent); font-weight: 800; }

      /* ---------- generic cards & buttons ---------- */
      .panel { background: var(--surface); border: 3px solid var(--border); border-radius: 24px; }
      .btn { border: none; border-radius: 16px; font-weight: 800; font-family: var(--display); }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-green { background: #22c55e; color: #fff; }
      .btn-cream { background: #fef3c7; color: #92400e; }
      .btn-rose { background: #ffe4e6; color: #be123c; }
      .btn-ghost { background: var(--surface); border: 2px solid var(--border); color: var(--dim); font-weight: 700; }

      /* ---------- level map ---------- */
      .hero {
        margin-top: 0.5rem; border-radius: 24px; padding: 1rem; color: #fff;
        background: linear-gradient(120deg, #2563eb, #0ea5e9);
      }
      .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
      @media (min-width: 640px) { .level-grid { grid-template-columns: repeat(4, 1fr); } }
      .level-btn { border-radius: 24px; padding: 0.75rem; text-align: left; width: 100%; }
      .level-btn .num { font-family: var(--display); font-size: 22px; font-weight: 800; }
      .level-btn .ttl { margin-top: 2px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---------- pet picker ---------- */
      .pet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 2rem; }
      @media (min-width: 640px) { .pet-actions { grid-template-columns: 1fr 1fr !important; } }
      @media (min-width: 1024px) { .pet-grid { grid-template-columns: repeat(4, 1fr); } }
      .pet-card { border-radius: 24px; padding: 1rem; background: var(--surface); width: 100%; text-align: center; box-shadow: 0 8px 20px rgba(23,37,84,0.12); }
      .pet-card img { width: min(150px, 100%); aspect-ratio: 1/1; object-fit: cover; border-radius: 50%; display: block; margin: 0 auto; }

      /* ---------- play ---------- */
      .qcard { margin-top: 1rem; border-radius: 24px; padding: 1.25rem; background: var(--surface); border: 3px solid var(--border); }
      .qtype { display: inline-block; border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 12px; font-weight: 800; background: #e0eaff; color: #1d4ed8; }
      .qtype.spot { background: #fef3c7; color: #92400e; }
      .bigword { font-family: var(--display); font-size: 38px; font-weight: 800; text-align: center; overflow-wrap: anywhere; }
      .flipbox { border-radius: 24px; padding: 1.25rem; background: linear-gradient(150deg, #dbeafe, #eff6ff); border: 3px dashed #93c5fd; text-align: center; }
      .two-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .big-btn { border-radius: 16px; padding: 1rem 0.5rem; font-size: 18px; font-weight: 800; font-family: var(--display); border: none; width: 100%; }
      .hintbar { margin-top: 1.25rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; border-radius: 16px; padding: 0.75rem; background: #fff7e6; }
      .hintbtn { border: none; border-radius: 999px; padding: 0.5rem 0.9rem; font-size: 14px; font-weight: 700; background: #fde68a; color: #713f12; }
      .hintbtn:disabled { opacity: 0.4; }
      .feedback { border-radius: 16px; padding: 1rem; text-align: center; font-weight: 700; }
      .spell-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
      .spell-input {
        flex: 1; min-width: 0; border-radius: 16px; padding: 0.8rem 1rem; font-size: 18px; font-weight: 700;
        border: 3px solid var(--border); background: #fffdf5; color: var(--text); font-family: var(--display);
      }
      .progress-track { margin-top: 4px; height: 12px; border-radius: 999px; background: #fde9c0; overflow: hidden; }
      .progress-fill { height: 100%; border-radius: 999px; background: #22c55e; transition: width .3s; }
      .listen-btn {
        width: 92px; height: 92px; border-radius: 50%; border: none; color: #fff; font-size: 40px;
        background: linear-gradient(135deg, #2563eb, #0ea5e9); box-shadow: 0 10px 24px rgba(37,99,235,0.4);
      }

      /* ---------- collection cards ---------- */
      .coll-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      @media (min-width: 640px) { .coll-grid { grid-template-columns: repeat(4, 1fr); } }
      .tcard { border-radius: 18px; position: relative; overflow: hidden; }
      .tcard-inner { border-radius: 14px; padding: 10px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; position: relative; overflow: hidden; }
      .tcard-inner.big { padding: 16px 14px; gap: 10px; }
      .tcard .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.20) 1.6px, transparent 1.7px); background-size: 17px 17px; pointer-events: none; }
      .tcard .portrait { width: 100%; border-radius: 12px; overflow: hidden; border: 3px solid rgba(255,255,255,0.75); box-shadow: 0 8px 20px rgba(0,0,0,0.30); background: #dbeafe; position: relative; }
      .tcard .portrait img { display: block; width: 100%; aspect-ratio: 3/4; object-fit: cover; }
      .tcard .motif-circle { border-radius: 50%; background: radial-gradient(circle at 50% 38%, rgba(255,255,255,0.5), rgba(255,255,255,0.10) 68%); display: flex; align-items: center; justify-content: center; position: relative; }
      .tcard .cname { font-family: var(--display); font-weight: 800; line-height: 1.15; position: relative; }
      .tcard .rarity { font-weight: 700; color: #1e293b; background: rgba(255,255,255,0.94); border-radius: 999px; padding: 2px 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); position: relative; }
      .sheen-wrap { position: absolute; inset: 0; overflow: hidden; border-radius: 14px; pointer-events: none; }
      .sheen { position: absolute; top: -20%; bottom: -20%; width: 45%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent); }
      .shineflash { position: absolute; inset: -30px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.85), transparent 55%); pointer-events: none; z-index: 2; }
      .count-badge { position: absolute; right: 8px; top: 8px; z-index: 3; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 800; color: #fff; background: #f59e0b; }

      /* ---------- parent ---------- */
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem; }
      .stat { border-radius: 24px; padding: 1rem; background: var(--surface); border: 3px solid var(--border); }
      .stat .v { font-family: var(--display); font-size: 24px; font-weight: 800; }
      .series-row { display: flex; align-items: center; gap: 0.75rem; }
      .series-track { height: 12px; flex: 1; border-radius: 999px; background: #fde9c0; overflow: hidden; }
      .wrong-chip { display: inline-block; border-radius: 999px; padding: 0.35rem 0.75rem; font-size: 14px; font-weight: 600; background: #ffe4e6; color: #9f1239; margin: 0 0.4rem 0.4rem 0; }

      /* ---------- animations ---------- */
      @keyframes cardflip { 0% { transform: rotateY(0deg) scale(0.9); } 60% { transform: rotateY(200deg) scale(1.06); } 100% { transform: rotateY(360deg) scale(1); } }
      @keyframes popin { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes shineflash { 0% { opacity: 0; transform: scale(0.6) rotate(0deg); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6) rotate(40deg); } }
      @keyframes sheensweep { 0% { left: -55%; } 55%, 100% { left: 115%; } }
      .anim-cardflip { animation: cardflip 0.9s ease both; }
      .anim-popin { animation: popin 0.45s ease both; }
      .anim-floaty { animation: floaty 2.6s ease-in-out infinite; display: inline-block; }
      .anim-shine { animation: shineflash 1.1s ease both; }
      .anim-sheen { animation: sheensweep 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .anim-cardflip, .anim-popin, .anim-floaty, .anim-shine, .anim-sheen { animation: none; }
      }
    </style>
  </head>

            '<button type="button" data-act="reset-yes" style="border:none;border-radius:999px;padding:0.6rem 1.25rem;font-weight:700;color:#fff;background:#e11d48">确认清空</button>' +

      function bindParent() {
        const ask = app.querySelector('[data-act="reset-ask"]');

      /* ================= 闯关 ================= */
      let run = null;
      function normSpell(s) { return s.trim().toLowerCase().replace(/\s+/g, " ").replace(/[!?.,。！？]+$/, ""); }
      function letterPattern(en) {
        let shown = false;
        return en.split("").map(ch => {
          if (/[A-Za-z]/.test(ch)) { if (!shown) { shown = true; return ch; } return "_"; }
          return ch === " " ? "  " : ch;
        }).join(" ");
      }
      function buildRunQuestions(level) {
        if (level === "challenge") return buildQuestions(shuffle(state.wrong).slice(0, 20));
        return buildQuestions(levelWords(level));
      }
      function startRun(level) {
        playing = level;
        run = {
          level: level,
          isChallenge: level === "challenge",
          questions: buildRunQuestions(level),
          idx: 0, phase: "ask", recallStage: "think",
          lastCorrect: false, hintsLeft: 3, letterShown: false, spell: "",
          correctCount: 0, wrongWords: [], mastered: [], knownWords: [],
          spotAdded: false, box: null, boxStage: "none", finished: false,
          prevStars: level === "challenge" ? 0 : (state.stars[String(level)] || 0),
          round: 0, speakTimer: null
        };
        render();
      }
      function runResult() {
        const total = run.questions.length;
        const acc = total ? run.correctCount / total : 0;
        const starsEarned = run.isChallenge ? 0 : starsFor(acc);
        const passed = !run.isChallenge && acc >= 0.6;
        return { total, acc, starsEarned, passed, boxEarned: passed && (run.prevStars === 0 || starsEarned > run.prevStars) };
      }
      function finishRun() {
        if (run.finished) return;
        run.finished = true;
        const r = runResult();
        const wrong = state.wrong.slice();
        for (const w of run.wrongWords) if (!wrong.some(x => x.en === w.en && x.zh === w.zh)) wrong.push(w);
        state.wrong = wrong.filter(x => !run.mastered.some(m => m.en === x.en && m.zh === x.zh));
        if (run.level !== "challenge" && r.passed) {
          const prev = state.stars[String(run.level)] || 0;
          if (r.starsEarned > prev) state.stars[String(run.level)] = r.starsEarned;
        }
        state.answered += r.total;
        state.correct += run.correctCount;
        state.petXp += run.correctCount * 10;
        state.coins += run.correctCount * 2;
        save();
      }
      function openBox() {
        const card = drawCard();
        const duplicate = (state.cards[card.id] || 0) > 0;
        state.cards[card.id] = (state.cards[card.id] || 0) + 1;
        if (duplicate) state.coins += 50;
        state.boxesOpened += 1;
        save();
        return { card, duplicate };
      }
      function recordCorrect(word, viaSpot) {
        run.correctCount += 1;
        if (run.isChallenge && !viaSpot) run.mastered.push(word);
      }
      function recordWrong(word, viaSpot) {
        run.wrongWords.push(word);
        if (viaSpot) {
          const same = x => x.en === word.en && x.zh === word.zh;
          run.mastered = run.mastered.filter(x => !same(x));
          run.knownWords = run.knownWords.filter(x => !same(x));

          }

            '<div style="font-size:34px;font-weight:800;overflow-wrap:anywhere">' + esc(q.word.zh) + '</div>' +

        }
        if (q.type === "spell" && run.phase === "ask") {
          h += '<div style="text-align:center"><div style="font-size:30px;font-weight:800;overflow-wrap:anywhere">' + esc(q.word.zh) + "</div>" +
            '<p style="margin-top:0.5rem;font-weight:600;color:var(--dim)">' + (q.spot ? "这个词刚才说会了，拼一拼验证一下！" : "把它的英文拼出来吧！") + "</p>" +
            (run.letterShown ? '<p class="display" style="margin-top:0.5rem;font-size:18px;font-weight:800;color:#b45309">首字母提示：' + esc(letterPattern(q.word.en)) + "</p>" : "") +
            '<form class="spell-row" data-form="spell"><label for="spell-input" class="sr-only">输入英文拼写</label>' +
            '<input id="spell-input" class="spell-input" value="' + esc(run.spell) + '" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="在这里打英文…">' +
            '<button type="submit" class="btn btn-primary display" style="flex-shrink:0;padding:0 1.25rem' + (run.spell.trim() ? "" : ";opacity:.4") + '" ' + (run.spell.trim() ? "" : "disabled") + '>拼好啦</button></form></div>';
        }
        if (run.phase === "ask") {
          h += '<div class="hintbar"><span style="font-size:14px;font-weight:700;color:#92400e">' + esc(pet.name) + "帮你：</span>";
          if (q.type !== "recall") h += '<button type="button" data-act="hint-letter" class="hintbtn" ' + (run.hintsLeft <= 0 || run.letterShown ? "disabled" : "") + ">显示首字母</button>";
          if (q.type !== "listen") h += '<button type="button" data-act="hint-speak" class="hintbtn" ' + (run.hintsLeft <= 0 ? "disabled" : "") + ">念一遍这个词</button>";
          if (run.hintsLeft <= 0) h += '<span style="font-size:14px;color:var(--dim)">这关的提示用完啦</span>';
          h += "</div>";
        }
        if (run.phase === "feedback") {
          const ok = run.lastCorrect;
          let msg;
          if (ok) msg = q.spot ? "🎉 抽查过关，这个词真的记住啦！宠物经验 +10" : "🎉 答对啦！宠物经验 +10";
          else if (q.type === "spell") msg = q.spot
            ? "抽查没拼对，「" + esc(q.word.zh) + "」是 <span class='display'>" + esc(q.word.en) + "</span>，它进错词本啦，再练练！"
            : "就差一点！「" + esc(q.word.zh) + "」的拼写是 <span class='display'>" + esc(q.word.en) + "</span>";
          else msg = "这个词是 <span class='display'>" + esc(q.word.en) + "</span> = " + esc(q.word.zh) + "，记住它！";
          const isLast = run.idx + 1 >= total && (run.spotAdded || run.knownWords.filter(isSpellable).length === 0);
          h += '<div class="anim-popin" style="margin-top:1.25rem"><div class="feedback" role="status" style="background:' + (ok ? "#dcfce7" : "#ffe4e6") + ";color:" + (ok ? "#15803d" : "#be123c") + '">' + msg + "</div>" +
            '<button type="button" data-act="next" class="big-btn btn-green" style="margin-top:0.75rem">' + (isLast ? "看成绩 🏁" : "下一题 →") + "</button></div>";
        }
        return h + "</div></div>";
      }
      function doneHTML(pet, title) {
        const r = runResult();
        const total = r.total;
        const accPct = total ? Math.round((run.correctCount / total) * 100) : 0;
        let h = '<div style="padding-top:1rem"><div class="panel anim-popin" style="padding:1.5rem;text-align:center">' +
          '<div style="display:flex;justify-content:center">' + petAvatarHTML(state.pet, state.petXp, 84) + "</div>" +
          '<h2 class="display" style="font-size:26px;font-weight:800;margin:0.75rem 0 0">' +
          (run.isChallenge ? (accPct >= 60 ? "错词打败啦！" : "错词还没全打败") : r.passed ? "过关啦！🎉" : "差一点点，再试一次！") + "</h2>";
        if (!run.isChallenge && r.passed) h += '<div style="margin-top:0.5rem">' + starsHTML(r.starsEarned, 30) + "</div>";
        h += '<p style="margin-top:0.5rem;color:var(--dim)">答对 ' + run.correctCount + "/" + total + " 题 · 正确率 " + accPct + "% · 宠物经验 +" + (run.correctCount * 10) + "</p>";
        if (run.isChallenge && run.mastered.length > 0) h += '<p style="margin-top:0.25rem;font-weight:600;color:#16a34a">' + run.mastered.length + " 个错词已经学会，从错词本里毕业啦！</p>";
        if (!run.isChallenge && !r.passed) h += '<p style="margin-top:0.25rem;color:var(--dim)">正确率到 60% 就能过关开盲盒，加油！</p>';
        if (r.boxEarned && run.boxStage === "none") {
          h += '<button type="button" data-act="open-box" class="anim-popin display" style="margin-top:1.25rem;width:100%;border:none;border-radius:16px;padding:1rem;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(120deg,#f59e0b,#ef4444)">🎁 开盲盒！</button>';
        }
        if (run.boxStage === "back" && run.box) {
          const s = seriesOf(run.box.card.id);
          h += '<div style="margin:1.25rem auto 0;max-width:260px"><button type="button" data-act="flip-box" aria-label="翻开这张卡" style="background:none;border:none;padding:0;width:100%;min-height:0">' + cardBackHTML(s, true) + '</button><p style="margin-top:0.75rem;font-weight:700;color:#b45309">点一点卡片，把它翻开！</p></div>';
        }
        if (run.boxStage === "face" && run.box) {
          const s = seriesOf(run.box.card.id);
          h += '<div style="margin:1.25rem auto 0;max-width:260px">' + cardFaceHTML(run.box.card, s, true, { big: true, flip: true }) +
            '<p style="margin-top:0.75rem;font-weight:700;color:' + (run.box.duplicate ? "#b45309" : "#16a34a") + '">' + (run.box.duplicate ? "重复啦，变成 +50 金币 🪙" : "新卡到手！已放进收集册") + "</p></div>";
        }
        h += '<div class="two-btns" style="margin-top:1.25rem">' +
          '<button type="button" data-act="retry" class="btn display" style="padding:0.9rem;background:#fef3c7;color:#92400e">再玩一次</button>' +
          '<button type="button" data-act="exit" class="btn btn-primary display" style="padding:0.9rem">返回地图</button></div>';
        return h + "</div></div>";
      }
      function bindPlay() {
        const q = run.questions[run.idx];
        const on = (sel, fn) => { const el = app.querySelector(sel); if (el) el.addEventListener("click", fn); };
        on('[data-act="exit"]', () => { if (run.speakTimer) clearTimeout(run.speakTimer); playing = null; run = null; render(); });
        on('[data-act="speak-word"]', () => { if (q) speak(q.word.en); });
        app.querySelectorAll('[data-act="to-check"]').forEach(b => b.addEventListener("click", () => { run.recallStage = "check"; renderPlay(); }));
        on('[data-act="self-yes"]', () => answerSelf(true));
        on('[data-act="self-no"]', () => answerSelf(false));
        on('[data-act="hint-letter"]', () => {
          if (run.hintsLeft <= 0 || run.phase !== "ask" || run.letterShown) return;
          run.letterShown = true; run.hintsLeft -= 1; renderPlay();
        });
        on('[data-act="hint-speak"]', () => {
          if (run.hintsLeft <= 0 || run.phase !== "ask" || !q) return;
          speak(q.word.en); run.hintsLeft -= 1; renderPlay();
        });
        on('[data-act="next"]', nextQuestion);
        on('[data-act="retry"]', () => startRun(run.level));
        on('[data-act="open-box"]', () => { run.box = openBox(); run.boxStage = "back"; renderPlay(); });
        on('[data-act="flip-box"]', () => { run.boxStage = "face"; renderPlay(); });
        const form = app.querySelector('[data-form="spell"]');
        if (form) {
          const inp = document.getElementById("spell-input");
          inp.addEventListener("input", () => {
            run.spell = inp.value;
            const btn = form.querySelector('button[type="submit"]');
            if (btn) { if (inp.value.trim()) { btn.disabled = false; btn.style.opacity = ""; } else { btn.disabled = true; btn.style.opacity = ".4"; } }
          });
          form.addEventListener("submit", e => { e.preventDefault(); submitSpell(); });
        }
      }
      function answerSelf(ok) {
        const q = run.questions[run.idx];
        if (run.phase !== "ask" || run.recallStage !== "check" || !q) return;
        run.lastCorrect = ok;
        if (ok) { recordCorrect(q.word, false); run.knownWords.push(q.word); }
        else recordWrong(q.word, false);
        run.phase = "feedback";
        renderPlay();
      }
      function submitSpell() {
        const q = run.questions[run.idx];
        if (run.phase !== "ask" || !q) return;
        const inp = document.getElementById("spell-input");
        if (inp) run.spell = inp.value;
        const ok = normSpell(run.spell) === normSpell(q.word.en);
        run.lastCorrect = ok;
        if (ok) recordCorrect(q.word, q.spot === true); else recordWrong(q.word, q.spot === true);
        run.phase = "feedback";
        renderPlay();
      }
      function nextQuestion() {
        run.recallStage = "think"; run.letterShown = false; run.spell = "";
        const total = run.questions.length;
        if (run.idx + 1 < total) { run.idx += 1; run.phase = "ask"; renderPlay(); return; }
        if (!run.spotAdded) {
          run.spotAdded = true;
          const checks = buildSpotChecks(run.knownWords);
          if (checks.length) { run.questions = run.questions.concat(checks); run.idx += 1; run.phase = "ask"; renderPlay(); return; }
        }
        run.phase = "done";
        finishRun();
        renderPlay();
      }

      render();
    </script>
  </body>
</html>
